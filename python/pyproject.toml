[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-pipeline"
version = "0.1.0"
description = "Historical backfill, Parquet lakehouse, Polars analytics, and pluggable ranking — complements Rust Hyperion services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "polars>=1.5.0",
  "pyarrow>=17.0.0",
  "pandas>=2.2.2",
  "structlog>=24.2.0",
  "httpx>=0.27.0",
  "tenacity>=8.3.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
hyperion-pipeline = "hyperion_pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hyperion_pipeline"]
